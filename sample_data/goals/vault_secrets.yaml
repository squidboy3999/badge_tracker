users:
  - AppMaker
categories:
  - devops
  - software_dev

trees:
  - id: hashicorp_vault_mastery
    title: "Vault Secrets & Kubernetes Auth"
    description: "Eliminate plaintext secrets by mastering HashiCorp Vault KV-v2 engines, HCL policies, Kubernetes ServiceAccount authentication, and sidecar secret injection."
    advice: "Never bake Vault tokens into container images or ConfigMaps. Let the pod's native Kubernetes ServiceAccount JWT authenticate to Vault dynamically at runtime."
    badge: "vault_master.png"
    rule: "all"
    children:
      - id: kv_v2_and_cli_basics
        title: "KV-v2 Engine & Secret Versioning"
        description: "Store, version, roll back, and inspect secrets using the 'vault' CLI and HTTP API."
        advice: "In a KV-v2 engine mounted at 'secret/', the CLI uses 'vault kv put secret/hello', while the underlying API path inserts '/data/' ('secret/data/hello'). Keep that distinction in mind when writing policies!"
        badge: "kv_engine.png"
        rule: "all"
        children:
          - id: vault_status_and_login
            title: "Vault CLI Context & Health Check"
            description: "Configure VAULT_ADDR (or exec into the cluster's vault-0 pod), run 'vault status' to verify seal/HA state, and authenticate with a workstation or dev token."
            advice: "Run 'vault token lookup' right after logging in to inspect your token's attached policies, TTL, and renewability."
            badge: "vault_status.png"

          - id: kv_put_get_versioning
            title: "Hello World Secret & Version Rollback"
            description: "Write a secret ('vault kv put secret/hello-app api_key=v1_secret'), update it to 'v2_secret' and 'v3_secret', inspect specific historical versions ('-version=1'), and run 'vault kv rollback'."
            advice: "Practice retrieving raw JSON values for scripts using 'vault kv get -format=json secret/hello-app | jq -r .data.data.api_key'."
            badge: "kv_versioning.png"
            target: 3

          - id: response_wrapping_cubbyhole
            title: "Single-Use Response Wrapping"
            description: "Wrap a secret retrieval with '-wrap-ttl=5m', verify that unwrapping it once ('vault unwrap <token>') succeeds, and confirm a second unwrap attempt fails with an audit trail."
            advice: "Response wrapping ensures that even the operator transporting a bootstrap token cannot read the secret without burning the single-use token and alerting the recipient."
            badge: "response_wrap.png"

      - id: policies_and_k8s_auth
        title: "HCL Policies & Kubernetes ServiceAccount Auth"
        description: "Bind an OpenShift ServiceAccount and Namespace to a least-privilege Vault role with zero static credentials."
        advice: "Scope every Vault Kubernetes Auth Role to both a specific 'bound_service_account_names' AND 'bound_service_account_namespaces' so pods in other projects cannot assume the role."
        badge: "k8s_auth.png"
        rule: "all"
        children:
          - id: least_privilege_hcl_policy
            title: "Write a Read-Only HCL Policy"
            description: "Create 'hello-app-ro.hcl' granting 'capabilities = [\"read\"]' on 'secret/data/hello-app' and apply it with 'vault policy write'."
            advice: "Verify your policy immediately using 'vault token create -policy=hello-app-ro' and testing that 'vault kv get secret/hello-app' works while 'vault kv list secret/' is denied."
            badge: "hcl_policy.png"

          - id: kubernetes_auth_role_binding
            title: "Bind OpenShift ServiceAccount to Vault Role"
            description: "Create a dedicated ServiceAccount ('oc create sa hello-vault-sa') and configure 'vault write auth/kubernetes/role/hello-role' mapping that SA and namespace to your 'hello-app-ro' policy."
            advice: "Set a short token TTL (e.g., 'ttl=1h') on the role so issued tokens expire cleanly when workloads terminate."
            badge: "sa_role_bind.png"

          - id: jwt_login_handshake_test
            title: "Manual JWT Login Handshake From a Pod"
            description: "Exec into a pod running as 'hello-vault-sa', read '/var/run/secrets/kubernetes.io/serviceaccount/token', and exchange that JWT against Vault's '/v1/auth/kubernetes/login' endpoint."
            advice: "Seeing the raw curl/CLI exchange demystifies everything the sidecar injector does under the hood: JWT + Role Name in -> short-lived Vault Client Token out."
            badge: "jwt_handshake.png"

      - id: workload_secret_delivery
        title: "Zero-Code Pod Secret Injection"
        description: "Deliver Vault secrets directly into OpenShift pods via tmpfs memory mounts or synced Kubernetes Secrets."
        advice: "When using Vault Agent Injector annotations, secrets are rendered to an in-memory 'tmpfs' volume at '/vault/secrets/' and never touch node disk or etcd."
        badge: "secret_delivery.png"
        rule: "any"
        children:
          - id: agent_injector_annotations
            title: "Vault Agent Sidecar Injector"
            description: "Add 'vault.hashicorp.com/agent-inject: \"true\"' and role/secret annotations to a Hello World deployment and verify the secret appears at '/vault/secrets/hello-app'."
            advice: "Inspect the pod after deployment ('oc get pod <pod> -o yaml') to see the mutated init-container and sidecar container injected by the webhook."
            badge: "sidecar_injector.png"

          - id: custom_consul_template
            title: "Formatted Env/JSON Secret Template"
            description: "Use 'vault.hashicorp.com/agent-inject-template-hello-app' to render the raw secret into a formatted '.env' or 'config.json' file ready for your application to source."
            advice: "Without a custom template, Vault dumps the raw map output. A 3-line template lets legacy apps source '/vault/secrets/config.env' with zero code changes."
            badge: "secret_template.png"

          - id: dynamic_or_eso_sync
            title: "ExternalSecret CRD or Dynamic Lease"
            description: "Either sync a Vault secret into an OpenShift Secret via an 'ExternalSecret' CRD, or generate a short-lived dynamic credential/certificate and inspect its lease renewal."
            advice: "Use Vault Agent tmpfs mounts when you want secrets kept completely out of etcd, or External Secrets Operator (ESO) when third-party Helm charts strictly require a native Kubernetes Secret."
            badge: "dynamic_lease.png"
